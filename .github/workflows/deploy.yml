name: Déploiement GitHub Pages

# Tout ce qui arrive sur `main` part en PRODUCTION sur https://cfrq.ca.
# Le domaine est servi par GitHub Pages (fichier public/CNAME), la zone DNS est
# chez Cloudflare et le registraire est GoDaddy : voir MISE_EN_PROD.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build Astro
        run: npm run build
        env:
          SITE_URL: https://cfrq.ca
          SITE_BASE: /
          # L'espace client n'est pas encore ouvert au public : la connexion
          # et le tableau de bord ne sont pas construits, et /espace-client
          # sert la page qui explique le projet et annonce qu'il est en
          # construction. Pour l'ouvrir, passer cette variable à "1" : les
          # boutons du site basculent alors d'eux-mêmes vers la connexion.
          PUBLIER_ESPACE_CLIENT: "0"
      - name: Vérifier le rendu avant publication
        run: node scripts/verifier-build.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
